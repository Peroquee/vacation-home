# Pipeline for the Vacation Rental Manager.
#
# Two kinds of pipeline exist: merge request pipelines, and default-branch
# pipelines after a merge. A push to a feature branch with no open merge
# request creates nothing, because no workflow rule matches it.

# The runner takes one job at a time, so a pipeline lasts as long as its jobs
# together (GitLab #149): the app is built once, before the tests, which
# start it from the build's output; the four quick checks share one job; and
# the browser and its system libraries come from caches, not downloads.
stages:
  - install
  - quality
  - build
  - test
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Redundant - GitLab already creates no pipeline when nothing matches - but
    # kept so the intent is stated rather than inferred from an absence.
    - when: never

variables:
  # npm's download store has to sit inside the project directory for GitLab's
  # cache to carry it between jobs. It is ignored by git, ESLint and Prettier,
  # each of which would otherwise walk it.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # The git hooks are a local developer convenience; installing them into a
  # throwaway CI clone is wasted work.
  HUSKY: "0"

# Two caches, because they have different lifetimes. The download store keeps a
# stable key so it survives a dependency bump and only the changed packages are
# re-fetched. The installed tree is keyed on the lockfile, since it is valid
# only for the lockfile that produced it.
.npm_store: &npm_store
  key: npm-store
  paths:
    - .npm/

.node_modules: &node_modules
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

default:
  # Pinned to exactly the version .nvmrc names. `node:24-bookworm` floats to
  # the newest 24.x and would silently drift away from local development.
  image: node:24.20.0-bookworm
  interruptible: true
  cache:
    - <<: *npm_store
      policy: pull
    - <<: *node_modules
      policy: pull

.node:
  before_script:
    # node_modules normally arrives from the cache. Reinstall only when it did
    # not, so an evicted cache degrades to a slower job rather than a failing
    # one. The install job re-seeds both caches on every pipeline.
    - |
      if [ ! -d node_modules ]; then
        echo "cache miss - installing dependencies"
        npm ci --prefer-offline --no-audit --no-fund
      fi
    # The Prisma client is generated into src/, which no cache carries. `npm
    # ci` generates it via postinstall, but a cache hit skips the install, so
    # generate it explicitly. It needs no database and takes well under a
    # second.
    - npm run db:generate

install:
  stage: install
  # Not interruptible: cancelling this job part-way through its cache upload
  # would leave a partial archive for every later job to trip over.
  interruptible: false
  cache:
    - <<: *npm_store
      policy: pull-push
    - <<: *node_modules
      policy: pull-push
  script:
    # The installed tree is cached under the lockfile's hash, so a cache hit
    # is exactly what `npm ci` would produce; only a miss installs.
    - |
      if [ -d node_modules ]; then
        echo "node_modules restored from the cache for this lockfile"
      else
        npm ci --prefer-offline --no-audit --no-fund
      fi
    # A block scalar, because an unquoted script item containing ": " is valid
    # YAML but parses as a map rather than a command string.
    - |
      if [ "v$(cat .nvmrc)" != "$(node --version)" ]; then
        echo "Node mismatch - image is $(node --version) but .nvmrc pins v$(cat .nvmrc)"
        echo "Bump the image in .gitlab-ci.yml and .nvmrc together."
        exit 1
      fi

# Lint, the dependency audit, the type check and formatting: each takes
# seconds, a job of its own costs more than that in setup. All four run even
# when one fails, so a single pipeline shows every problem.
quality:
  stage: quality
  extends: .node
  # Needs no build output.
  dependencies: []
  script:
    - |
      failed=""
      npm run lint || failed="$failed lint"
      # High and critical advisories in production dependencies fail the
      # pipeline unless reviewed in security/audit-allowlist.json.
      npm run audit || failed="$failed audit"
      npm run typecheck || failed="$failed typecheck"
      npm run format:check || failed="$failed format"
      if [ -n "$failed" ]; then
        echo "Failed:$failed"
        exit 1
      fi

# Unit tests, then the database tests against a PostgreSQL service of their
# own: a failure here no longer hides the browser tests' result, which run in
# their own job. Both suites run even when the first fails.
test:
  stage: test
  extends: .node
  dependencies: []
  services:
    - name: postgres:16.15
      alias: postgres
  variables:
    POSTGRES_USER: vacation
    POSTGRES_PASSWORD: vacation
    POSTGRES_DB: vacation_home
    TEST_DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation_home_test
  script:
    - |
      failed=""
      npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/unit.xml || failed="$failed unit"
      npm run test:db -- --reporter=default --reporter=junit --outputFile.junit=reports/db.xml || failed="$failed db"
      if [ -n "$failed" ]; then
        echo "Failed:$failed"
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/*.xml

e2e:
  stage: test
  extends: .node
  # The build job's .next: the server starts on it (E2E_PREBUILT).
  dependencies: [build]
  # The same server version as docker-compose.yml. The harness drops and
  # recreates its own database on it before the run, so no state survives
  # between pipelines.
  services:
    - name: postgres:16.15
      alias: postgres
    # Catches the app's emails for e2e/emails.spec.ts (GitLab #111): SMTP on
    # 1025, its API on 8025.
    - name: axllent/mailpit:v1.31.3
      alias: mailpit
  variables:
    POSTGRES_USER: vacation
    POSTGRES_PASSWORD: vacation
    POSTGRES_DB: vacation_home
    E2E_DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation_home_e2e
    E2E_SMTP_HOST: mailpit
    E2E_MAILPIT_URL: http://mailpit:8025
    E2E_PREBUILT: "1"
    # Inside the project directory so the cache below can carry the browser.
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    - <<: *npm_store
      policy: pull
    - <<: *node_modules
      policy: pull
    # Keyed on the lockfile, since the browser build is tied to the exact
    # @playwright/test version.
    - key:
        prefix: playwright
        files:
          - package-lock.json
      paths:
        - .cache/ms-playwright/
    # The browser's system libraries as Debian packages (about 77 MB, a
    # minute to download): only the first run of a Playwright version fetches
    # them. Not Playwright's own image: its 1 GB pull from mcr.microsoft.com
    # broke off on this network.
    - key:
        prefix: playwright-apt
        files:
          - package-lock.json
      paths:
        - .cache/apt/
  before_script:
    - !reference [.node, before_script]
    # The browser has to match the installed @playwright/test exactly. Debian's
    # image deletes downloaded packages (docker-clean); kept, they are cached.
    - |
      rm -f /etc/apt/apt.conf.d/docker-clean
      mkdir -p .cache/apt
      cp .cache/apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      npx playwright install --with-deps chromium
      cp /var/cache/apt/archives/*.deb .cache/apt/ 2>/dev/null || true
  script:
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: reports/playwright.xml

# Lighthouse on the calendar, the dashboard (GitLab #97) and the public
# property page (GitLab #105): the same setup as e2e (database, browser, the
# build's output), measuring performance under Lighthouse's mobile
# throttling. Every page must score 90 or more,
# judged by the median of LIGHTHOUSE_RUNS runs (scores move a few points
# between identical runs). Reports of every run: lighthouse/.
lighthouse:
  extends: e2e
  # It sends no email: no Mailpit, and no SMTP for the app.
  services:
    - name: postgres:16.15
      alias: postgres
  variables:
    E2E_SMTP_HOST: ""
    E2E_MAILPIT_URL: ""
    LIGHTHOUSE_RUNS: "3"
  # e2e keeps the browser caches up to date; this job only reads them.
  cache:
    - <<: *npm_store
      policy: pull
    - <<: *node_modules
      policy: pull
    - key:
        prefix: playwright
        files:
          - package-lock.json
      paths:
        - .cache/ms-playwright/
      policy: pull
    - key:
        prefix: playwright-apt
        files:
          - package-lock.json
      paths:
        - .cache/apt/
      policy: pull
  script:
    - npm run test:lighthouse
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lighthouse/
    reports:
      junit: reports/playwright.xml

build:
  stage: build
  extends: .node
  dependencies: []
  # No cache of .next/cache: Turbopack's is about 230 MB, and archiving and
  # restoring it on this runner costs about what it saves (34 s cold, 11 s
  # warm, measured for GitLab #149).
  script:
    # No environment variables here on purpose: validation runs from
    # src/instrumentation.ts at server boot, not at build time, so a build
    # never needs production secrets.
    - npm run build
    # The image processing the production image ships (GitLab #106): sharp
    # from the standalone output, with its native binary, re-encodes a picture.
    - node scripts/check-standalone-sharp.mjs
    # First-load JavaScript per page against bundle-budgets.json (GitLab #97).
    - node scripts/bundle-report.mjs --json > bundle-report.json || true
    - node scripts/bundle-report.mjs
  artifacts:
    when: always
    expire_in: 1 day
    # For e2e and lighthouse, which start the server on it (`next start`):
    # without Next's cache and the standalone copy, which only the image uses.
    paths:
      - bundle-report.json
      - .next/
    exclude:
      - .next/cache/**/*
      - .next/standalone/**/*

# Deploys main to your own server once everything above has passed: over SSH,
# it runs scripts/deploy/deploy.sh on the Docker host, which builds the new
# version there and swaps it in (docs/deployment.md, "Automatic deploys").
#
# Off until it is configured: it runs only when the project has the CI/CD
# variables DEPLOY_HOST (e.g. deploy@192.168.178.50), DEPLOY_SSH_KEY (a
# "File" variable with the private key) and DEPLOY_KNOWN_HOSTS (the host's
# line from ~/.ssh/known_hosts), and DEPLOY_PATH if the checkout is not at
# /opt/vacation-home. Rolling back is a manual step, documented there.
deploy:
  stage: deploy
  image: alpine:3.24
  # Never two deploys at once; a newer one waits for the running one.
  resource_group: production
  interruptible: false
  cache: []
  # Every check, lighthouse included (GitLab #143): on the serial runner the
  # job order varies, and a job left out here could fail after the deploy.
  # scripts/ci.test.ts keeps this list complete.
  needs:
    - quality
    - test
    - e2e
    - lighthouse
    # Only that it passed: the deploy builds on the server, not from here.
    - job: build
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $DEPLOY_SSH_KEY
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh -i "$DEPLOY_SSH_KEY" "$DEPLOY_HOST" "${DEPLOY_PATH:-/opt/vacation-home}/scripts/deploy/deploy.sh --ref $CI_COMMIT_SHA"
