# Pipeline for the Vacation Rental Manager.
#
# Two kinds of pipeline exist: merge request pipelines, and default-branch
# pipelines after a merge. A push to a feature branch with no open merge
# request creates nothing, because no workflow rule matches it.

stages:
  - install
  - quality
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Redundant - GitLab already creates no pipeline when nothing matches - but
    # kept so the intent is stated rather than inferred from an absence.
    - when: never

variables:
  # npm's download store has to sit inside the project directory for GitLab's
  # cache to carry it between jobs. It is ignored by git, ESLint and Prettier,
  # each of which would otherwise walk it.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # The git hooks are a local developer convenience; installing them into a
  # throwaway CI clone is wasted work.
  HUSKY: "0"

# Two caches, because they have different lifetimes. The download store keeps a
# stable key so it survives a dependency bump and only the changed packages are
# re-fetched. The installed tree is keyed on the lockfile, since it is valid
# only for the lockfile that produced it.
.npm_store: &npm_store
  key: npm-store
  paths:
    - .npm/

.node_modules: &node_modules
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

default:
  # Pinned to exactly the version .nvmrc names. `node:24-bookworm` floats to
  # the newest 24.x and would silently drift away from local development.
  image: node:24.20.0-bookworm
  interruptible: true
  cache:
    - <<: *npm_store
      policy: pull
    - <<: *node_modules
      policy: pull

.node:
  before_script:
    # node_modules normally arrives from the cache. Reinstall only when it did
    # not, so an evicted cache degrades to a slower job rather than a failing
    # one. The install job re-seeds both caches on every pipeline.
    - |
      if [ ! -d node_modules ]; then
        echo "cache miss - installing dependencies"
        npm ci --prefer-offline --no-audit --no-fund
      fi
    # The Prisma client is generated into src/, which no cache carries. `npm
    # ci` generates it via postinstall, but a cache hit skips the install, so
    # generate it explicitly. It needs no database and takes well under a
    # second.
    - npm run db:generate

install:
  stage: install
  # Not interruptible: cancelling this job part-way through its cache upload
  # would leave a partial archive for every later job to trip over.
  interruptible: false
  cache:
    - <<: *npm_store
      policy: pull-push
    - <<: *node_modules
      policy: pull-push
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # A block scalar, because an unquoted script item containing ": " is valid
    # YAML but parses as a map rather than a command string.
    - |
      if [ "v$(cat .nvmrc)" != "$(node --version)" ]; then
        echo "Node mismatch - image is $(node --version) but .nvmrc pins v$(cat .nvmrc)"
        echo "Bump the image in .gitlab-ci.yml and .nvmrc together."
        exit 1
      fi

lint:
  stage: quality
  extends: .node
  script:
    - npm run lint

typecheck:
  stage: quality
  extends: .node
  script:
    - npm run typecheck

format:
  stage: quality
  extends: .node
  script:
    - npm run format:check

test:
  stage: test
  extends: .node
  script:
    # Wired up but empty until #44 adds Vitest and Playwright.
    # `npm run test --if-present` exits 0 when no `test` script exists, so the
    # stage exists without implying coverage does. Note the stage order comes
    # from #43; Playwright needs a built app, so #44's e2e job will have to
    # build or run the dev server itself rather than rely on `build` below.
    - npm run test --if-present

build:
  stage: build
  extends: .node
  script:
    # No environment variables here on purpose: validation runs from
    # src/instrumentation.ts at server boot, not at build time, so a build
    # never needs production secrets.
    - npm run build
