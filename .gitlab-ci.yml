# Pipeline for the Vacation Rental Manager.
#
# Two kinds of pipeline exist: merge request pipelines, and default-branch
# pipelines after a merge. A push to a feature branch with no open merge
# request creates nothing, because no workflow rule matches it.

stages:
  - install
  - quality
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Redundant - GitLab already creates no pipeline when nothing matches - but
    # kept so the intent is stated rather than inferred from an absence.
    - when: never

variables:
  # npm's download store has to sit inside the project directory for GitLab's
  # cache to carry it between jobs. It is ignored by git, ESLint and Prettier,
  # each of which would otherwise walk it.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # The git hooks are a local developer convenience; installing them into a
  # throwaway CI clone is wasted work.
  HUSKY: "0"

# Two caches, because they have different lifetimes. The download store keeps a
# stable key so it survives a dependency bump and only the changed packages are
# re-fetched. The installed tree is keyed on the lockfile, since it is valid
# only for the lockfile that produced it.
.npm_store: &npm_store
  key: npm-store
  paths:
    - .npm/

.node_modules: &node_modules
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

default:
  # Pinned to exactly the version .nvmrc names. `node:24-bookworm` floats to
  # the newest 24.x and would silently drift away from local development.
  image: node:24.20.0-bookworm
  interruptible: true
  cache:
    - <<: *npm_store
      policy: pull
    - <<: *node_modules
      policy: pull

.node:
  before_script:
    # node_modules normally arrives from the cache. Reinstall only when it did
    # not, so an evicted cache degrades to a slower job rather than a failing
    # one. The install job re-seeds both caches on every pipeline.
    - |
      if [ ! -d node_modules ]; then
        echo "cache miss - installing dependencies"
        npm ci --prefer-offline --no-audit --no-fund
      fi
    # The Prisma client is generated into src/, which no cache carries. `npm
    # ci` generates it via postinstall, but a cache hit skips the install, so
    # generate it explicitly. It needs no database and takes well under a
    # second.
    - npm run db:generate

install:
  stage: install
  # Not interruptible: cancelling this job part-way through its cache upload
  # would leave a partial archive for every later job to trip over.
  interruptible: false
  cache:
    - <<: *npm_store
      policy: pull-push
    - <<: *node_modules
      policy: pull-push
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # A block scalar, because an unquoted script item containing ": " is valid
    # YAML but parses as a map rather than a command string.
    - |
      if [ "v$(cat .nvmrc)" != "$(node --version)" ]; then
        echo "Node mismatch - image is $(node --version) but .nvmrc pins v$(cat .nvmrc)"
        echo "Bump the image in .gitlab-ci.yml and .nvmrc together."
        exit 1
      fi

lint:
  stage: quality
  extends: .node
  script:
    - npm run lint

audit:
  stage: quality
  extends: .node
  script:
    # High and critical advisories in production dependencies fail the
    # pipeline unless reviewed in security/audit-allowlist.json.
    - npm run audit

typecheck:
  stage: quality
  extends: .node
  script:
    - npm run typecheck

format:
  stage: quality
  extends: .node
  script:
    - npm run format:check

test:
  stage: test
  extends: .node
  script:
    - npm test

e2e:
  stage: test
  extends: .node
  # The same server version as docker-compose.yml. The harness drops and
  # recreates its own database on it before the run, so no state survives
  # between pipelines.
  services:
    - name: postgres:16.15
      alias: postgres
  variables:
    POSTGRES_USER: vacation
    POSTGRES_PASSWORD: vacation
    POSTGRES_DB: vacation_home
    E2E_DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation_home_e2e
    TEST_DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation_home_test
    # Inside the project directory so the cache below can carry the browser.
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    - <<: *npm_store
      policy: pull
    - <<: *node_modules
      policy: pull
    # Keyed on the lockfile, since the browser build is tied to the exact
    # @playwright/test version.
    - key:
        prefix: playwright
        files:
          - package-lock.json
      paths:
        - .cache/ms-playwright/
  script:
    # The browser has to match the installed @playwright/test exactly. On a
    # cache hit only the system libraries are installed; the Node image ships
    # neither them nor the browser.
    - npx playwright install --with-deps chromium
    # Database tests share this job for its postgres service; each suite
    # resets its own database, so they do not interfere.
    - npm run test:db
    # Builds and starts the app itself (see webServer in playwright.config.ts),
    # so this does not depend on the build job below.
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/

# Lighthouse on the calendar, the dashboard (GitLab #97) and the public
# property page (GitLab #105): the same setup as e2e (database, browser, a
# production build), measuring performance under Lighthouse's mobile
# throttling. Every page must score 90 or more,
# judged by the median of LIGHTHOUSE_RUNS runs (scores move a few points
# between identical runs). Reports of every run: lighthouse/.
lighthouse:
  extends: e2e
  variables:
    LIGHTHOUSE_RUNS: "3"
  script:
    - npx playwright install --with-deps chromium
    - npm run test:lighthouse
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lighthouse/

build:
  stage: build
  extends: .node
  script:
    # No environment variables here on purpose: validation runs from
    # src/instrumentation.ts at server boot, not at build time, so a build
    # never needs production secrets.
    - npm run build
    # First-load JavaScript per page against bundle-budgets.json (GitLab #97).
    - node scripts/bundle-report.mjs --json > bundle-report.json || true
    - node scripts/bundle-report.mjs
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - bundle-report.json

# Deploys main to your own server once everything above has passed: over SSH,
# it runs scripts/deploy/deploy.sh on the Docker host, which builds the new
# version there and swaps it in (docs/deployment.md, "Automatic deploys").
#
# Off until it is configured: it runs only when the project has the CI/CD
# variables DEPLOY_HOST (e.g. deploy@192.168.178.50), DEPLOY_SSH_KEY (a
# "File" variable with the private key) and DEPLOY_KNOWN_HOSTS (the host's
# line from ~/.ssh/known_hosts), and DEPLOY_PATH if the checkout is not at
# /opt/vacation-home. Rolling back is a manual step, documented there.
deploy:
  stage: deploy
  image: alpine:3.24
  # Never two deploys at once; a newer one waits for the running one.
  resource_group: production
  interruptible: false
  cache: []
  needs: [lint, audit, typecheck, format, test, e2e, build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $DEPLOY_SSH_KEY
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh -i "$DEPLOY_SSH_KEY" "$DEPLOY_HOST" "${DEPLOY_PATH:-/opt/vacation-home}/scripts/deploy/deploy.sh --ref $CI_COMMIT_SHA"
